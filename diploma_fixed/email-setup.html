<!DOCTYPE html><html lang="kk"><head>  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Email Setup | EduBridge</title><link rel="stylesheet" href="css/style.css"><style>.setup{max-width:760px;margin:120px auto;padding:32px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:24px}.setup input{width:100%;padding:15px;border-radius:14px;margin:8px 0 18px;background:#2d1b22;color:white;border:1px solid rgba(255,255,255,.18)}.setup code{background:#2d1b22;padding:2px 6px;border-radius:6px}.ok{color:#7CFFB2}</style></head><body><header class="header"><div class="container header-inner"><a href="index.html" class="logo">EduBridge <span>Türkiye</span></a><nav class="nav"><a href="index.html"><span data-i18n="nav-home">Басты бет</span></a><a href="profile.html"><span data-i18n="nav-profile">Профиль</span></a></nav></div></header><main class="setup"><h1>EmailJS config</h1><p>Тіркелу коды және дедлайн email шынымен жіберілуі үшін EmailJS мәндерін осында сақта.</p><p>Template ішінде міндетті айнымалылар болсын: <code>{{to_email}}</code>, <code>{{subject}}</code>, <code>{{message}}</code>, <code>{{code}}</code>.</p><label>EMAILJS_PUBLIC_KEY</label><input id="pub" placeholder="мысалы: qAxxxxxx"><label>EMAILJS_SERVICE_ID</label><input id="svc" placeholder="мысалы: service_xxxxxx"><label>EMAILJS_TEMPLATE_ID</label><input id="tpl" placeholder="мысалы: template_xxxxxx"><button class="btn btn-primary" onclick="saveCfg()">Config сақтау</button> <button class="btn btn-secondary" onclick="testEmail()">Test email жіберу</button><p id="msg"></p></main><script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script><script src="js/config.js"></script><script>function load(){pub.value=localStorage.getItem('emailjs_public_key')||CONFIG.EMAILJS_PUBLIC_KEY||'';svc.value=localStorage.getItem('emailjs_service_id')||CONFIG.EMAILJS_SERVICE_ID||'';tpl.value=localStorage.getItem('emailjs_template_id')||CONFIG.EMAILJS_TEMPLATE_ID||'';}function saveCfg(){localStorage.setItem('emailjs_public_key',pub.value.trim());localStorage.setItem('emailjs_service_id',svc.value.trim());localStorage.setItem('emailjs_template_id',tpl.value.trim());msg.innerHTML='<span class="ok">✅ Сақталды. Енді register/deadline email шынымен жіберіледі.</span>';}async function testEmail(){saveCfg();let to=prompt('Қай email-ға test жібереміз?');if(!to)return;try{await eduSendEmail(to,'EduBridge test email','EmailJS config жұмыс істеп тұр ✅',{code:'123456'});msg.innerHTML='<span class="ok">✅ Test email жіберілді</span>'}catch(e){msg.textContent='❌ Жіберілмеді: '+e.message}}load();</script>  <script src="js/backend-client.js"></script>

  <script src="js/i18n-core.js"></script>
  <script src="js/i18n-email-setup.js"></script>
</body></html>
